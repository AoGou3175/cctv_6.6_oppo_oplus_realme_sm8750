# 6.6 批量 KPM 构建入口。
#
# 这些 fastbuild 工作流需要在远程仓库中声明 workflow_call 后，才能被本文件复用。
# 保留独立版本与唯一工件名，并与上游 KernelSU 分支同步。

name: build-test_6.6_kpm

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU 分支'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启 susfs'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启 KPM'
        required: true
        type: boolean
        default: true
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: 'BBR 算法模式'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: 'Droidspaces 容器支持模式'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置'
        required: true
        type: boolean
        default: false
      adios_enable:
        description: '是否启用 ADIOS IO 调度器'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: '是否启用 Re-Kernel 支持'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '是否开启内核级基带保护'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '是否更新 ccache 缓存'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: '是否上传 ccache 调试日志'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀，留空使用默认值'
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  build_30:
    name: 构建 6.6.30
    uses: ./.github/workflows/fastbuild_6.6.30.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_50:
    name: 构建 6.6.50
    uses: ./.github/workflows/fastbuild_6.6.50.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_56:
    name: 构建 6.6.56
    uses: ./.github/workflows/fastbuild_6.6.56.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_57:
    name: 构建 6.6.57
    uses: ./.github/workflows/fastbuild_6.6.57.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_66:
    name: 构建 6.6.66
    uses: ./.github/workflows/fastbuild_6.6.66.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_89:
    name: 构建 6.6.89
    uses: ./.github/workflows/fastbuild_6.6.89.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}
  build_89_mtk:
    name: 构建 6.6.89 MTK
    uses: ./.github/workflows/fastbuild_6.6.89_mtk.yml
    with:
      ksu_type: ${{ inputs.ksu_type }}
      susfs_enable: ${{ inputs.susfs_enable }}
      kpm_enable: ${{ inputs.kpm_enable }}
      lz4_enable: ${{ inputs.lz4_enable }}
      lz4kd_enable: ${{ inputs.lz4kd_enable }}
      bbr_enable: ${{ inputs.bbr_enable }}
      droidspaces_enable: ${{ inputs.droidspaces_enable }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      rekernel_enable: ${{ inputs.rekernel_enable }}
      baseband_guard: ${{ inputs.baseband_guard }}
      ccache_update: ${{ inputs.ccache_update }}
      ccache_debug: ${{ inputs.ccache_debug }}
      kernel_suffix: ${{ inputs.kernel_suffix }}

  release:
    name: 汇总七个版本并发布
    if: ${{ needs.build_30.result == 'success' && needs.build_50.result == 'success' && needs.build_56.result == 'success' && needs.build_57.result == 'success' && needs.build_66.result == 'success' && needs.build_89.result == 'success' && needs.build_89_mtk.result == 'success' }}
    needs:
      - build_30
      - build_50
      - build_56
      - build_57
      - build_66
      - build_89
      - build_89_mtk
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 下载七个 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          pattern: AnyKernel3_*.zip
          path: ./release_zips
          merge-multiple: true
          skip-decompress: true
      - name: 校验七个 ZIP 工件
        shell: bash
        run: |
          shopt -s nullglob
          zips=(release_zips/AnyKernel3_*.zip)
          if [[ "${#zips[@]}" -ne 7 ]]; then
            echo "期望 7 个 ZIP，实际找到 ${#zips[@]} 个" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          printf '已找到：%s\n' "${zips[@]}"
      - name: 创建统一 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSU_TYPE: ${{ inputs.ksu_type }}
          KSUVER: ${{ needs.build_30.outputs.ksuver }}
          SUSFS_ENABLE: ${{ inputs.susfs_enable }}
          KPM_ENABLE: ${{ inputs.kpm_enable }}
          LZ4_ENABLE: ${{ inputs.lz4_enable }}
          LZ4KD_ENABLE: ${{ inputs.lz4kd_enable }}
          BBR_ENABLE: ${{ inputs.bbr_enable }}
          DROIDSPACES_ENABLE: ${{ inputs.droidspaces_enable }}
          BETTER_NET: ${{ inputs.better_net }}
          ADIOS_ENABLE: ${{ inputs.adios_enable }}
          REKERNEL_ENABLE: ${{ inputs.rekernel_enable }}
          BASEBAND_GUARD: ${{ inputs.baseband_guard }}
          CCACHE_UPDATE: ${{ inputs.ccache_update }}
          CCACHE_DEBUG: ${{ inputs.ccache_debug }}
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
        shell: bash
        run: |
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          TAG="OPPO-OPlus-Realme-build-all-${TIME}-${GITHUB_RUN_ID}"
          MANAGER_REPO=""
          MANAGER_ASSET_FILTER=""
          case "$KSU_TYPE" in
            bakasu)
              KSU_TYPENAME="BakaSU"
              MANAGER_REPO="cctv18/BakaSU_CI"
              # 上游已更名，但新 CI Release 尚未上线时沿用可用的管理器仓库。
              if ! gh api "repos/$MANAGER_REPO/releases/latest" --silent 2>/dev/null; then
                echo "::warning::BakaSU_CI Release 暂不可用，使用 ReSukiSU_CI 管理器"
                MANAGER_REPO="cctv18/ReSukiSU_CI"
              fi
              MANAGER_ASSET_FILTER='endswith("-arm64-v8a-release.apk")'
              ;;
            sukisu)
              KSU_TYPENAME="SukiSU Ultra"
              MANAGER_REPO="SukiSU-Ultra/SukiSU-Ultra"
              MANAGER_ASSET_FILTER='startswith("SukiSU_") and endswith("-release.apk")'
              ;;
            ksunext)
              KSU_TYPENAME="KernelSU Next"
              MANAGER_REPO="KernelSU-Next/KernelSU-Next"
              MANAGER_ASSET_FILTER='startswith("KernelSU_Next_") and endswith("-release.apk") and (contains("spoofed") | not)'
              ;;
            ksu)
              KSU_TYPENAME="KSU"
              MANAGER_REPO="tiann/KernelSU"
              MANAGER_ASSET_FILTER='startswith("KernelSU_") and endswith("-release.apk")'
              ;;
            *)
              KSU_TYPENAME="无内置KSU"
              ;;
          esac
          MANAGER_ASSET_NAME="未附带"
          if [[ -n "$MANAGER_REPO" ]]; then
            MANAGER_ASSET_LINE="$(gh api "repos/$MANAGER_REPO/releases/latest" --jq ".assets[] | select(.name | $MANAGER_ASSET_FILTER) | [.name, .browser_download_url] | @tsv" | head -n 1)"
            if [[ -z "$MANAGER_ASSET_LINE" ]]; then
              echo "未找到 $MANAGER_REPO 的管理器 APK" >&2
              exit 1
            fi
            IFS=$'\t' read -r MANAGER_ASSET_NAME MANAGER_ASSET_URL <<< "$MANAGER_ASSET_LINE"
            curl --fail --location --retry 3 "$MANAGER_ASSET_URL" --output "release_zips/$MANAGER_ASSET_NAME"
          fi
          cat > release_notes.md <<EOF
          ### 📱 欧加真 ${KSU_TYPENAME} 6.6.X 通用内核 | 构建信息
          - 内核版本号：6.6.30、6.6.50、6.6.56、6.6.57、6.6.66、6.6.89、6.6.89_mtk
          - 编译时间：${TIME_FORM}
          - 机型：欧加真骁龙 8 Elite / 天玑特供 6.6.X 内核
          - KSU分支：${KSU_TYPENAME}
          - susfs支持：${SUSFS_ENABLE}
          - KPM支持：${KPM_ENABLE}
          - LZ4支持：${LZ4_ENABLE}
          - LZ4KD支持：${LZ4KD_ENABLE}
          - 网络功能增强：${BETTER_NET}
          - BBR/Brutal 等拥塞控制算法支持：${BBR_ENABLE}
          - Droidspaces 容器支持：${DROIDSPACES_ENABLE}
          - ADIOS IO 调度器支持：${ADIOS_ENABLE}
          - Re-Kernel支持：${REKERNEL_ENABLE}
          - 内核级基带保护：${BASEBAND_GUARD}
          - ccache 更新：${CCACHE_UPDATE}
          - ccache 调试日志：${CCACHE_DEBUG}
          - 内核后缀：${KERNEL_SUFFIX}

          ### 📦 各版本内核详细对应关系
          | 内核版本 | 平台与详细说明 | 源码分支 |
          | --- | --- | --- |
          | 6.6.30 | 欧加真骁龙 8 Elite 通用 6.6.30 内核，基于一加 13 6.6 源码 | [sm8750_v_15.0.0_oneplus_13](https://github.com/cctv18/android_kernel_common_oneplus_sm8750/tree/oneplus/sm8750_v_15.0.0_oneplus_13) |
          | 6.6.50 | 欧加真天玑特供 6.6.50 内核，基于一加 Ace5 Ultra 官方 OKI 源码 | [mt6991_v_15.0.2_ace5_ultra](https://github.com/cctv18/android_kernel_oneplus_mt6991/tree/oneplus/mt6991_v_15.0.2_ace5_ultra) |
          | 6.6.56 | 欧加真骁龙 8 Elite 通用 6.6.56 内核，基于一加 13T 官方 OKI 源码 | [sm8750_v_15.0.2_oneplus_13t](https://github.com/cctv18/android_kernel_common_oneplus_sm8750/tree/oneplus/sm8750_v_15.0.2_oneplus_13t) |
          | 6.6.57 | 欧加真骁龙 8 Elite 通用 6.6.57 内核，基于一加 Pad 2 Pro 官方 OKI 源码 | [sm8750_v_15.0.1_pad_2_pro](https://github.com/cctv18/android_kernel_common_oneplus_sm8750/tree/oneplus/sm8750_v_15.0.1_pad_2_pro) |
          | 6.6.66 | 欧加真骁龙 8 Elite 通用 6.6.66 内核，基于一加 13 官方 OKI 源码 | [sm8750_v_15.0.2_oneplus_13_6.6.66](https://github.com/cctv18/android_kernel_common_oneplus_sm8750/tree/oneplus/sm8750_v_15.0.2_oneplus_13_6.6.66) |
          | 6.6.89 | 欧加真骁龙 8 Elite 通用 6.6.89 内核，基于一加 13 官方 OKI 源码 | [sm8750_v_16.0.0_oneplus_13_6.6.89](https://github.com/cctv18/android_kernel_common_oneplus_sm8750/tree/oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89) |
          | 6.6.89_mtk | 欧加真天玑特供 6.6.89 内核，基于一加 Ace5 Ultra 官方 OKI 源码 | [mt6991_v_15.0.2_ace5_ultra_6.6.89](https://github.com/cctv18/android_kernel_oneplus_mt6991/tree/oneplus/mt6991_v_15.0.2_ace5_ultra_6.6.89) |

          - BakaSU管理器下载：[BakaSU_CI](https://github.com/cctv18/BakaSU_CI/releases)（迁移期间备用：[ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)）
          - SukiSU Ultra管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)
          - 本次构建对应管理器 APK：${MANAGER_ASSET_NAME}

          ### ⏫️ 更新内容：
          - 更新${KSU_TYPENAME}至最新版本（${KSUVER}）
          - (预留)

          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方 Recovery（如 TWRP），可下载对应机型的 AnyKernel 刷机包后进入 Recovery 模式，通过 Recovery 刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装 [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在 HorizonKernelFlasher 中刷入 AnyKernel 刷机包并重启；
          3. 若你之前已刷入 SukiSU Ultra 内核，且 SukiSU Ultra 管理器已更新至最新版本，可在 SukiSU Ultra 管理器中直接刷入 AnyKernel 刷机包并重启；
          4. 刷入无 LZ4KD 补丁版的内核前若刷入过 LZ4KD 补丁版的内核，为避免出错，请先关闭 zram 模块；
          5. 由于 KernelSU 上游更新了元模块功能，最新版 KSU 管理器需要配合元模块（metamodule）才能正常挂载模块。可使用 [meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs)、[mountify](https://github.com/backslashxx/mountify) 等元模块；
          6. KernelPatch Next（即 KPN）是一个独立于 KSU 的 KPM 实现，可以运行在任意 KSU/面具环境中（不适用于 Apatch），且不能与 BakaSU/ReSukiSU 内置的 KPM 实现共同使用。

          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用 [KernelFlasher](https://github.com/capntrips/KernelFlasher) 等软件备份 boot 等关键启动分区!※※※
          EOF
          shopt -s nullglob
          release_assets=(release_zips/AnyKernel3_*.zip release_zips/*.apk)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "欧加真 ${KSU_TYPENAME} 6.6.X 通用内核 | 构建信息" \
            --notes-file release_notes.md \
            "${release_assets[@]}"
